name = "implementer"
description = "仕様が固まっているタスクの実装・リファクタ・ドキュメント執筆・調査まとめ。標準的な作業を丸ごと任せる。会話文脈は引き継がれないため、仕様・対象パス・完了条件を prompt に自己完結で含めること。"
